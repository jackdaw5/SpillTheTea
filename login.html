<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container no-sidebars">

    <header>
      <div class="header-left">
        <h1>My Blog</h1>
        <nav>
          <ul>
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="addPage.html" class="nav-link">Add Post</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <aside class="sidebar1" aria-label="Primary sidebar"></aside>
    <aside class="sidebar2" aria-label="Secondary sidebar"></aside>

    <main>
      <article class="login-card">
        <h2>Login</h2>
        <p>Sign in to continue.</p>

        <!-- both fields are required, browser blocks submission unless email and username are filled -->
        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>

          <button type="submit">Login</button>
        </form>
      </article>
    </main>

    <footer>
      <h3>SpillTheTea2026</h3>
    </footer>

  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      localStorage.setItem("email", document.getElementById("email").value);
      localStorage.setItem("username", document.getElementById("username").value);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
