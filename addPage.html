<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Add post</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
    <header>
            <h1>My Blog</h1>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="addPage.html" class="nav-link">Add Post</a></li>
                </ul>
            </nav>
    </header>

    <aside class="sidebar1" aria-label="Primary sidebar"></aside>
    <aside class="sidebar2" aria-label="Secondary sidebar"></aside>

    <main>
      <form action="/index.html">
        <div class="addpost-container">
            <div id="post-box">
              <label for="post-body">Post<br>body</label>
              <textarea id="post-body" name="body" placeholder="textarea"></textarea>
            </div>
            <div id="select-box">
              <label for="file">Select file</label>
              <input type="file" id="file" name="file" hidden>
              <button type="button" id="choose-button" class="button">Choose File</button><br><br>
            </div>
            <div>
              <input type="submit" id="create-post" class="button" value="Create post">
            </div>
        </div>
      </form>
    </main>
      <footer>
        <h3>SpillTheTea2026</h3>
      </footer>
    </div>
